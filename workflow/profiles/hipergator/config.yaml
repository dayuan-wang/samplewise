# snakemake --profile workflow/profiles/hipergator
# Needs the snakemake-executor-plugin-slurm package in the Snakemake env.
executor: slurm
jobs: 50
use-conda: true
printshellcmds: true
rerun-incomplete: true
keep-going: true
default-resources:
  slurm_account: paefron
  slurm_extra: "'--qos=paefron'"
  mem_mb: 16000
  runtime: 120
  cpus_per_task: 1
